name: Reset from source and add DR ASR structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-and-extend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone source repository
        run: |
          rm -rf /tmp/source-lz
          git clone --depth 1 https://github.com/sonmap/azure-landing-zone_test04_ENT.git /tmp/source-lz

      - name: Reset target content from source repository
        run: |
          find . -mindepth 1 \
            ! -path './.git' \
            ! -path './.git/*' \
            ! -path './.github' \
            ! -path './.github/workflows' \
            ! -path './.github/workflows/reset-from-source-add-dr.yml' \
            -exec rm -rf {} +

          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/reset-from-source-add-dr.yml' \
            /tmp/source-lz/ ./

          mkdir -p .github/workflows

      - name: Add DR Terraform roots
        run: |
          mkdir -p \
            live/D00-foundation/resource-groups \
            live/D10-platform/dr-hub-network-jpe \
            live/D20-workload/dr-sales-prod-spoke-jpe \
            live/D30-services/dr-vm-placeholder \
            live/D40-access/dr-private-dns-records \
            live/50-asr/recovery-vault-jpe \
            live/50-asr/asr-sales-prod \
            live/50-asr/recovery-plan-sales-prod \
            live/60-operations/automation-dr \
            live/60-operations/inventory \
            modules/recovery_services_vault \
            runbooks

          cat > docs/REPOSITORY_REDESIGN.md <<'EOF'
# Repository Redesign: 기존 Landing Zone + D-prefix DR 확장

본 저장소는 `azure-landing-zone_test04_ENT`를 원본으로 복사한 뒤 DR/ASR 영역을 추가한다.

| 구분 | 경로 | 역할 |
|---|---|---|
| 주센터 기존 | `live/00~40` | 기존 Landing Zone 유지 |
| DR Foundation | `live/D00-foundation` | DR Resource Group |
| DR Platform | `live/D10-platform` | DR Hub VNet/Subnet |
| DR Workload | `live/D20-workload` | DR Spoke VNet/Subnet/Peering |
| DR Service Placeholder | `live/D30-services` | ASR VM Mapping. VM 미생성 |
| DR Access | `live/D40-access` | DR DNS / Access |
| ASR | `live/50-asr` | Vault / Policy / Recovery Plan |
| Operations | `live/60-operations` | Runbook / Inventory |

DR VM은 평상시 Terraform으로 생성하지 않고 ASR Failover 시 생성한다. 단, DR 네트워크와 DNS/Access 기반은 사전 생성한다.
EOF

          cat > modules/recovery_services_vault/main.tf <<'EOF'
resource "azurerm_recovery_services_vault" "this" {
  name                = var.name
  location            = var.location
  resource_group_name = var.resource_group_name
  sku                 = var.sku
  soft_delete_enabled = var.soft_delete_enabled
  tags                = var.tags
}
EOF
          cat > modules/recovery_services_vault/variables.tf <<'EOF'
variable "name" { type = string }
variable "location" { type = string }
variable "resource_group_name" { type = string }
variable "sku" { type = string, default = "Standard" }
variable "soft_delete_enabled" { type = bool, default = true }
variable "tags" { type = map(string), default = {} }
EOF
          cat > modules/recovery_services_vault/outputs.tf <<'EOF'
output "vault_id" { value = azurerm_recovery_services_vault.this.id }
output "vault_name" { value = azurerm_recovery_services_vault.this.name }
EOF

          for root in live/D10-platform/dr-hub-network-jpe live/D20-workload/dr-sales-prod-spoke-jpe live/D30-services/dr-vm-placeholder live/D40-access/dr-private-dns-records live/50-asr/recovery-vault-jpe; do
            cat > "$root/versions.tf" <<'EOF'
terraform {
  required_version = ">= 1.6.0"
  backend "azurerm" {}
  required_providers {
    azurerm = {
      source  = "hashicorp/azurerm"
      version = "~> 3.116"
    }
  }
}
provider "azurerm" { features {} }
EOF
          done

          cat > live/D00-foundation/resource-groups/README.md <<'EOF'
# D00-foundation / resource-groups

DR Resource Group 생성 영역이다. 기존 `00-foundation/resource-groups` 패턴에 맞춰 구성한다.
EOF

          cat > live/D10-platform/dr-hub-network-jpe/main.tf <<'EOF'
module "dr_hub" {
  source = "../../../modules/workload_spoke"
  name                    = var.vnet_name
  location                = var.location
  resource_group_name     = var.resource_group_name
  address_space           = var.address_space
  dns_servers             = var.dns_servers
  hub_vnet_id             = null
  hub_resource_group_name = null
  hub_vnet_name           = null
  firewall_private_ip     = null
  subnets                 = var.subnets
  tags                    = var.common_tags
}
EOF
          cat > live/D10-platform/dr-hub-network-jpe/variables.tf <<'EOF'
variable "location" { type = string }
variable "resource_group_name" { type = string }
variable "vnet_name" { type = string }
variable "address_space" { type = list(string) }
variable "dns_servers" { type = list(string), default = [] }
variable "subnets" {
  type = map(object({
    name = string
    address_prefixes = list(string)
    create_nsg = optional(bool, true)
    associate_route_table = optional(bool, false)
    private_endpoint_network_policies = optional(string)
  }))
}
variable "common_tags" { type = map(string), default = {} }
EOF
          cat > live/D10-platform/dr-hub-network-jpe/terraform.tfvars.example <<'EOF'
location            = "japaneast"
resource_group_name = "rg-sl-dr-hub-jpe"
vnet_name           = "vnet-sl-dr-hub-jpe"
address_space       = ["10.110.0.0/16"]
dns_servers         = []
common_tags = { project = "azure-landing-zone-asr-runbook-ent", environment = "dr", region_role = "dr", workload = "platform", managed_by = "terraform" }
subnets = {
  firewall   = { name = "AzureFirewallSubnet", address_prefixes = ["10.110.0.0/24"], create_nsg = false, associate_route_table = false }
  dns_shared = { name = "snet-dns-shared", address_prefixes = ["10.110.1.0/24"], create_nsg = true, associate_route_table = false }
  mgmt       = { name = "snet-mgmt", address_prefixes = ["10.110.2.0/24"], create_nsg = true, associate_route_table = false }
}
EOF
          cat > live/D10-platform/dr-hub-network-jpe/outputs.tf <<'EOF'
output "dr_hub_vnet_id" { value = module.dr_hub.vnet_id }
output "dr_hub_vnet_name" { value = module.dr_hub.vnet_name }
output "dr_hub_subnet_ids" { value = module.dr_hub.subnet_ids }
EOF

          cat > live/D20-workload/dr-sales-prod-spoke-jpe/main.tf <<'EOF'
module "dr_sales_spoke" {
  source = "../../../modules/workload_spoke"
  name                    = var.vnet_name
  location                = var.location
  resource_group_name     = var.resource_group_name
  address_space           = var.address_space
  dns_servers             = var.dns_servers
  hub_vnet_id             = var.dr_hub_vnet_id
  hub_resource_group_name = var.dr_hub_resource_group_name
  hub_vnet_name           = var.dr_hub_vnet_name
  firewall_private_ip     = var.dr_firewall_private_ip
  subnets                 = var.subnets
  tags                    = var.common_tags
}
EOF
          cat > live/D20-workload/dr-sales-prod-spoke-jpe/variables.tf <<'EOF'
variable "location" { type = string }
variable "resource_group_name" { type = string }
variable "vnet_name" { type = string }
variable "address_space" { type = list(string) }
variable "dns_servers" { type = list(string), default = [] }
variable "dr_hub_vnet_id" { type = string }
variable "dr_hub_resource_group_name" { type = string }
variable "dr_hub_vnet_name" { type = string }
variable "dr_firewall_private_ip" { type = string, default = null }
variable "subnets" {
  type = map(object({
    name = string
    address_prefixes = list(string)
    create_nsg = optional(bool, true)
    associate_route_table = optional(bool, true)
    private_endpoint_network_policies = optional(string)
  }))
}
variable "common_tags" { type = map(string), default = {} }
EOF
          cat > live/D20-workload/dr-sales-prod-spoke-jpe/terraform.tfvars.example <<'EOF'
location            = "japaneast"
resource_group_name = "rg-sl-sales-prod-dr-jpe"
vnet_name           = "vnet-sl-sales-prod-dr-jpe"
address_space       = ["10.120.0.0/16"]
dns_servers         = []
dr_hub_vnet_id             = "<DR_HUB_VNET_ID>"
dr_hub_resource_group_name = "rg-sl-dr-hub-jpe"
dr_hub_vnet_name           = "vnet-sl-dr-hub-jpe"
dr_firewall_private_ip     = null
common_tags = { project = "azure-landing-zone-asr-runbook-ent", environment = "dr", region_role = "dr", workload = "sales", dr_protected = "true", managed_by = "terraform" }
subnets = {
  web   = { name = "snet-web",   address_prefixes = ["10.120.0.0/24"], create_nsg = true, associate_route_table = true }
  was   = { name = "snet-was",   address_prefixes = ["10.120.1.0/24"], create_nsg = true, associate_route_table = true }
  db    = { name = "snet-db",    address_prefixes = ["10.120.2.0/24"], create_nsg = true, associate_route_table = true }
  pe    = { name = "snet-pe",    address_prefixes = ["10.120.3.0/24"], create_nsg = true, associate_route_table = true, private_endpoint_network_policies = "Disabled" }
  agent = { name = "snet-agent", address_prefixes = ["10.120.4.0/24"], create_nsg = true, associate_route_table = true }
}
EOF
          cat > live/D20-workload/dr-sales-prod-spoke-jpe/outputs.tf <<'EOF'
output "dr_spoke_vnet_id" { value = module.dr_sales_spoke.vnet_id }
output "dr_spoke_vnet_name" { value = module.dr_sales_spoke.vnet_name }
output "dr_spoke_subnet_ids" { value = module.dr_sales_spoke.subnet_ids }
output "asr_target_subnet_mapping" {
  value = {
    web = module.dr_sales_spoke.subnet_ids["web"]
    was = module.dr_sales_spoke.subnet_ids["was"]
    db = module.dr_sales_spoke.subnet_ids["db"]
    pe = module.dr_sales_spoke.subnet_ids["pe"]
    agent = module.dr_sales_spoke.subnet_ids["agent"]
  }
}
EOF

          cat > live/D30-services/dr-vm-placeholder/main.tf <<'EOF'
locals { dr_vm_mapping = var.dr_vm_mapping }
EOF
          cat > live/D30-services/dr-vm-placeholder/variables.tf <<'EOF'
variable "dr_vm_mapping" {
  description = "Source VM to DR subnet mapping. This root does not create DR VMs."
  type = map(object({ source_vm_name = string, role = string, source_subnet = string, target_subnet = string, recovery_group = number, create_by = string }))
}
EOF
          cat > live/D30-services/dr-vm-placeholder/terraform.tfvars.example <<'EOF'
dr_vm_mapping = {
  db01 = { source_vm_name = "db01", role = "db", source_subnet = "snet-db", target_subnet = "snet-db", recovery_group = 1, create_by = "ASR Failover" }
  was01 = { source_vm_name = "was01", role = "was", source_subnet = "snet-was", target_subnet = "snet-was", recovery_group = 2, create_by = "ASR Failover" }
  was02 = { source_vm_name = "was02", role = "was", source_subnet = "snet-was", target_subnet = "snet-was", recovery_group = 2, create_by = "ASR Failover" }
  web01 = { source_vm_name = "web01", role = "web", source_subnet = "snet-web", target_subnet = "snet-web", recovery_group = 3, create_by = "ASR Failover" }
  web02 = { source_vm_name = "web02", role = "web", source_subnet = "snet-web", target_subnet = "snet-web", recovery_group = 3, create_by = "ASR Failover" }
}
EOF
          cat > live/D30-services/dr-vm-placeholder/outputs.tf <<'EOF'
output "dr_vm_mapping" { value = local.dr_vm_mapping }
output "recovery_plan_groups" {
  value = {
    group1_db = [for k, v in local.dr_vm_mapping : v.source_vm_name if v.recovery_group == 1]
    group2_was = [for k, v in local.dr_vm_mapping : v.source_vm_name if v.recovery_group == 2]
    group3_web = [for k, v in local.dr_vm_mapping : v.source_vm_name if v.recovery_group == 3]
  }
}
EOF

          cat > live/D40-access/dr-private-dns-records/main.tf <<'EOF'
resource "azurerm_private_dns_zone" "this" {
  count               = var.create_private_dns_zone ? 1 : 0
  name                = var.private_dns_zone_name
  resource_group_name = var.dns_resource_group_name
  tags                = var.common_tags
}
resource "azurerm_private_dns_a_record" "records" {
  for_each            = var.a_records
  name                = each.value.name
  zone_name           = var.private_dns_zone_name
  resource_group_name = var.dns_resource_group_name
  ttl                 = each.value.ttl
  records             = each.value.records
  depends_on          = [azurerm_private_dns_zone.this]
}
EOF
          cat > live/D40-access/dr-private-dns-records/variables.tf <<'EOF'
variable "dns_resource_group_name" { type = string }
variable "private_dns_zone_name" { type = string }
variable "create_private_dns_zone" { type = bool, default = false }
variable "a_records" { type = map(object({ name = string, ttl = number, records = list(string) })), default = {} }
variable "common_tags" { type = map(string), default = {} }
EOF
          cat > live/D40-access/dr-private-dns-records/terraform.tfvars.example <<'EOF'
dns_resource_group_name = "rg-sl-dr-hub-jpe"
private_dns_zone_name   = "corp.internal"
create_private_dns_zone = false
common_tags = { project = "azure-landing-zone-asr-runbook-ent", environment = "dr", region_role = "dr", workload = "access", managed_by = "terraform" }
a_records = {}
EOF
          cat > live/D40-access/dr-private-dns-records/outputs.tf <<'EOF'
output "private_dns_zone_name" { value = var.private_dns_zone_name }
output "a_record_names" { value = { for k, v in azurerm_private_dns_a_record.records : k => v.fqdn } }
EOF

          cat > live/50-asr/recovery-vault-jpe/main.tf <<'EOF'
module "recovery_vault" {
  source = "../../../modules/recovery_services_vault"
  name                = var.vault_name
  location            = var.location
  resource_group_name = var.resource_group_name
  sku                 = var.sku
  soft_delete_enabled = var.soft_delete_enabled
  tags                = var.common_tags
}
EOF
          cat > live/50-asr/recovery-vault-jpe/variables.tf <<'EOF'
variable "location" { type = string }
variable "resource_group_name" { type = string }
variable "vault_name" { type = string }
variable "sku" { type = string, default = "Standard" }
variable "soft_delete_enabled" { type = bool, default = true }
variable "common_tags" { type = map(string), default = {} }
EOF
          cat > live/50-asr/recovery-vault-jpe/terraform.tfvars.example <<'EOF'
location            = "japaneast"
resource_group_name = "rg-sl-dr-asr-jpe"
vault_name          = "rsv-sl-asr-jpe"
sku                 = "Standard"
soft_delete_enabled = true
common_tags = { project = "azure-landing-zone-asr-runbook-ent", environment = "dr", region_role = "dr", workload = "asr", managed_by = "terraform" }
EOF
          cat > live/50-asr/recovery-vault-jpe/outputs.tf <<'EOF'
output "vault_id" { value = module.recovery_vault.vault_id }
output "vault_name" { value = module.recovery_vault.vault_name }
EOF

          cat > runbooks/dr-precheck.ps1 <<'EOF'
param([string]$ResourceGroupName = "rg-sl-sales-prod-dr-jpe", [string]$VaultResourceGroupName = "rg-sl-dr-asr-jpe", [string]$VaultName = "rsv-sl-asr-jpe")
Write-Output "[DR-PRECHECK] Start"
Connect-AzAccount -Identity
Get-AzResourceGroup -Name $ResourceGroupName -ErrorAction Stop | Out-Null
Get-AzRecoveryServicesVault -ResourceGroupName $VaultResourceGroupName -Name $VaultName -ErrorAction Stop | Out-Null
Write-Output "[DR-PRECHECK] Completed"
EOF
          cat > runbooks/dr-health-check.ps1 <<'EOF'
param([string]$ResourceGroupName = "rg-sl-sales-prod-dr-jpe")
Connect-AzAccount -Identity
Get-AzVM -ResourceGroupName $ResourceGroupName -Status | Select-Object Name, PowerState
EOF
          cat > runbooks/dr-dns-switch.ps1 <<'EOF'
param([string]$DnsResourceGroupName = "rg-sl-dr-hub-jpe", [string]$PrivateDnsZoneName = "corp.internal", [string]$RecordName = "sales", [string]$DrIpAddress = "10.120.0.10")
Connect-AzAccount -Identity
Write-Output "Switch $RecordName.$PrivateDnsZoneName to $DrIpAddress"
EOF
          cat > runbooks/dr-inventory-update.ps1 <<'EOF'
param([string]$ResourceGroupName = "rg-sl-sales-prod-dr-jpe")
Connect-AzAccount -Identity
Get-AzResource -ResourceGroupName $ResourceGroupName | ConvertTo-Json -Depth 10
EOF

          cat > live/60-operations/inventory/README.md <<'EOF'
# 60-operations / inventory

Azure Resource Graph 기반 Inventory / CMDB Export 영역이다.
EOF

          cat >> README.md <<'EOF'

---

## DR / ASR 확장 구조

원본 `azure-landing-zone_test04_ENT`를 기준으로 복사한 뒤 아래 영역을 추가한다.

| 구분 | 경로 | 설명 |
|---|---|---|
| DR Foundation | `live/D00-foundation` | DR Resource Group |
| DR Platform | `live/D10-platform` | DR Hub VNet/Subnet |
| DR Workload | `live/D20-workload` | DR Spoke VNet/Subnet/Peering |
| DR Service Placeholder | `live/D30-services` | ASR Failover 대상 매핑. VM 미생성 |
| DR Access | `live/D40-access` | DR DNS / Access |
| ASR | `live/50-asr` | Vault / Policy / Recovery Plan |
| Operations | `live/60-operations` | Runbook / Inventory |
EOF

      - name: Commit reset and DR extension
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reset from source landing zone and add DR network ASR roots"
            git push
          fi
